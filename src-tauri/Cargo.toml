[package]
name = "lumasift-windows"
version = "0.1.0"
description = "LumaSift exact media duplicate resolution for Windows"
authors = ["LumaSift"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "lumasift_windows_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
thiserror = "2.0"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2.5"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_NetworkManagement_WNet"] }
