name: Windows Release

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
      - "scripts/**"
      - "docs/**"
      - "RELEASE_NOTES.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-package-release:
    name: Validate, package, and publish Windows release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Configure Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Configure Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify master engineering standard
        run: python scripts/verify_governance.py
      - name: Validate frontend and contract tests
        run: npm run test:all
      - name: Validate Rust formatting and tests
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo test
      - name: Build signed-ready installer payloads
        run: npm run package
      - name: Create checksums
        shell: pwsh
        run: |
          Get-ChildItem -Recurse src-tauri/target/release/bundle -Include *.msi,*.exe | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path)" } | Set-Content LumaSift-Windows-SHA256SUMS.txt
      - name: Publish release artifacts
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: windows-v0.1.0
          name: LumaSift Windows v0.1.0
          prerelease: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            LumaSift-Windows-SHA256SUMS.txt
